<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>HNPS Band Attendance — moved</title>
  <!-- This GitHub Pages copy is retired. The app now lives on Vercel.
       This page unregisters any cached service worker (so old offline
       copies stop serving) and forwards, preserving #/ deep links. -->
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (e) { /* best effort */ }
      location.replace('https://hnps-band-attendance.vercel.app/' + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="2;url=https://hnps-band-attendance.vercel.app/">
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background:#0b0f17; color:#e7ecf3;
           display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; }
    a { color:#7aa2ff; }
  </style>
</head>
<body>
  <p>The attendance app has moved.<br>
     Taking you to <a href="https://hnps-band-attendance.vercel.app/">hnps-band-attendance.vercel.app</a>…<br>
     <small>Please update your bookmark.</small></p>
</body>
</html>
