name: Keep Supabase Alive

# Two jobs in one: keeps the free-tier Supabase project awake, and acts as a
# canary on the security model.
#
# IMPORTANT: GitHub only runs scheduled workflows from the DEFAULT branch (main).
# A copy on this branch never fires on its own — the previous version of this
# file sat here for months and ran exactly zero times, which is why the backend
# auto-paused over the holidays and the app went down. This copy is kept in sync
# so the schedule still works if the default branch ever changes; the live one
# is on main.
#
# NOTE: GitHub disables schedules after ~60 days with no repo activity. Any push
# or a manual "Run workflow" re-arms it.
#
# The key below is the Supabase PUBLISHABLE (anon) key — safe to commit; it is
# already public inside the deployed app bundle. RLS is what protects the data,
# which is exactly what the second step verifies.

on:
  schedule:
    - cron: '0 19 */3 * *' # every 3 days, 19:00 UTC = 5am AEST.
                           # NOT weekly: Supabase pauses at ~7 days idle and
                           # GitHub cron can lag by hours — no margin.
  workflow_dispatch: {}

env:
  SUPABASE_URL: https://dirdanwihxwfuqldruoy.supabase.co
  ANON_KEY: sb_publishable_Q-_p3M1PmqBjhacTiuVdEg_lYoXDpQg

jobs:
  ping:
    name: Ping Supabase + verify RLS
    runs-on: ubuntu-latest
    steps:
      - name: Keep-alive ping
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/bands?select=id&limit=1" \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}")
          echo "Ping status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase returned $STATUS — project may be paused or unhealthy."
            cat /tmp/resp.txt
            exit 1
          fi
          echo "Backend awake."

      - name: RLS canary — anonymous callers must see nothing
        run: |
          set -euo pipefail
          # The whole security model rests on RLS: the anon key is public, so if
          # a policy is ever dropped or disabled in the dashboard, 71 children's
          # names become world-readable with no other signal. This turns that
          # into a failed workflow and an email.
          FAILED=0
          for TABLE in students attendance sessions allowed_users user_roles band_events event_attendance attendance_summary; do
            BODY=$(curl -sS "${SUPABASE_URL}/rest/v1/${TABLE}?select=*&limit=1" \
              -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}")
            if [ "$BODY" = "[]" ]; then
              echo "ok    ${TABLE}: anon sees nothing"
            else
              echo "::error::RLS REGRESSION — anon can read ${TABLE}: ${BODY:0:200}"
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::Anonymous access to children's data is possible. Fix immediately — see supabase/schema.sql for the intended policies."
            exit 1
          fi
          echo "RLS holding: anonymous callers can read nothing."
